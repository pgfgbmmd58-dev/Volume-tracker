<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=apple-mobile-web-app-capable content=yes><meta name=mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent><meta name=apple-mobile-web-app-title content=OptVol>
<meta name=theme-color content="#05070b"><link rel=apple-touch-icon href=apple-touch-icon.png><link rel=manifest href=manifest.webmanifest><title>Options Volume</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#05070b;color:#e8eef6;font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 60% at 20% 0%,#0f2a3a 0%,transparent 60%),radial-gradient(100% 50% at 90% 30%,#2a0f22 0%,transparent 60%),#05070b;background-attachment:fixed;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 16px) env(safe-area-inset-left)}
.glass{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:20px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
header{position:sticky;top:0;z-index:5;margin:8px 12px;padding:10px 12px;display:flex;align-items:center;gap:8px}
a.back{color:#8fb8ff;text-decoration:none;font-size:15px;padding:8px 6px;min-height:44px;display:flex;align-items:center}
.seg{display:flex;background:rgba(0,0,0,.35);border-radius:12px;padding:3px;flex:1}
.seg button{flex:1;min-height:40px;border:0;background:none;color:#9aa7b6;font:600 15px inherit;border-radius:9px;transition:all .25s}
.seg button.on{background:rgba(255,255,255,.12);color:#fff}
select{min-height:40px;background:rgba(0,0,0,.35);color:#e8eef6;border:0;border-radius:12px;padding:0 10px;font-size:15px;-webkit-appearance:none;appearance:none}
.hero{margin:0 12px;padding:18px 16px;text-align:center}
.spot{font:700 40px/1 ui-rounded,-apple-system,sans-serif;letter-spacing:-1px}
.sub{color:#7d8a99;font-size:12px;margin-top:6px}
.gauge{position:relative;width:240px;height:130px;margin:14px auto 0}
.gauge svg{width:100%;height:100%;overflow:visible}
.pc{position:absolute;left:0;right:0;bottom:-6px;text-align:center}
.pc b{font-size:30px;display:block}.pc span{font-size:11px;color:#7d8a99;letter-spacing:1.5px}
.cv{display:flex;justify-content:space-between;margin-top:8px;font-weight:600}
.c{color:#3df5a0}.p{color:#ff5277}
.ladder{margin:12px;padding:12px 8px}
.lh{display:flex;justify-content:space-between;font-size:11px;color:#7d8a99;letter-spacing:1.2px;padding:0 6px 8px}
.r{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;height:26px;transition:opacity .4s}
.r .k{text-align:center;font:600 13px ui-monospace,Menlo,monospace;color:#b5c0cc}
.r.atm .k{color:#fff;background:rgba(255,210,90,.16);border-radius:8px;box-shadow:0 0 14px rgba(255,210,90,.45)}
.b{height:14px;border-radius:7px;transition:width .8s cubic-bezier(.2,.8,.2,1);position:relative}
.L{display:flex;justify-content:flex-end}.L .b{background:linear-gradient(90deg,rgba(255,82,119,.15),#ff5277);box-shadow:0 0 calc(var(--h)*18px) rgba(255,82,119,var(--h))}
.R .b{background:linear-gradient(90deg,#3df5a0,rgba(61,245,160,.15));box-shadow:0 0 calc(var(--h)*18px) rgba(61,245,160,var(--h))}
.v{font-size:10px;color:#7d8a99;position:absolute;top:-1px;white-space:nowrap}.L .v{right:calc(100% + 4px)}.R .v{left:calc(100% + 4px)}
.pulse{animation:pulse 1.6s ease-out 3}@keyframes pulse{0%{filter:brightness(2.2)}100%{filter:brightness(1)}}
.flag::after{content:"";position:absolute;top:3px;width:8px;height:8px;border-radius:50%;background:#ffd25a;box-shadow:0 0 10px #ffd25a;animation:blink 1.2s infinite alternate}.L .flag::after{left:-10px;top:-8px}.R .flag::after{right:-10px;top:-8px}
@keyframes blink{to{opacity:.25}}
.tops{margin:12px;padding:14px}
.t{display:grid;grid-template-columns:62px 1fr 1fr 1fr;gap:4px;font-size:13px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}.t div:not(:first-child){text-align:right}
.th{color:#7d8a99;font-size:11px}.tabs2{display:flex;gap:6px;margin-bottom:8px}
.tabs2 button{flex:1;min-height:40px;border:0;border-radius:10px;background:rgba(0,0,0,.3);color:#9aa7b6;font:600 14px inherit}.tabs2 button.on.c{background:rgba(61,245,160,.15);color:#3df5a0}.tabs2 button.on.p{background:rgba(255,82,119,.15);color:#ff5277}
.warn{margin:0 12px 10px;padding:10px 14px;border-radius:14px;background:rgba(255,82,119,.15);border:1px solid rgba(255,82,119,.4);font-size:13px}
.vd{margin:12px;padding:14px 12px 10px}.vd .lh{padding:0 4px 6px}.vd svg{width:100%;height:auto;display:block}
.vr{font-size:13px;color:#cfd8e3;margin-top:6px;padding:0 4px;min-height:18px}.lg{display:flex;gap:12px;font-size:10px;color:#7d8a99;padding:4px 4px 0;flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.foot{text-align:center;color:#56616e;font-size:11px;padding:6px 20px}
.vb{transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.2,.8,.2,1),fill .4s,opacity .4s}.vb.fm{stroke:#fff;stroke-width:.8;stroke-dasharray:2 1.5;animation:fm 1.4s ease-in-out infinite alternate}@keyframes fm{to{opacity:.45}}.ld{animation:blink 1s infinite alternate}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3df5a0;box-shadow:0 0 8px #3df5a0;margin-right:5px;animation:blink 1.5s infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class=glass><a class=back href="../">‹ Desk</a><div class=seg><button data-s=SPY class=on>SPY</button><button data-s=QQQ>QQQ</button></div><select id=exp aria-label=Expiry></select></header>
<div id=err></div>
<section class="hero glass"><div class=spot id=spot>—</div><div class=sub id=sub>loading…</div>
<div class=gauge><svg viewBox="0 0 240 130"><defs><linearGradient id=g x1=0 x2=1><stop offset=0 stop-color="#3df5a0"/><stop offset=.5 stop-color="#ffd25a"/><stop offset=1 stop-color="#ff5277"/></linearGradient><filter id=gl><feGaussianBlur stdDeviation=3 result=b /><feMerge><feMergeNode in=b /><feMergeNode in=SourceGraphic /></feMerge></filter></defs>
<path d="M20 120A100 100 0 0 1 220 120" fill=none stroke="rgba(255,255,255,.08)" stroke-width=14 stroke-linecap=round />
<path id=arc d="M20 120A100 100 0 0 1 220 120" fill=none stroke="url(#g)" stroke-width=14 stroke-linecap=round filter="url(#gl)" stroke-dasharray="314.16" stroke-dashoffset="314.16" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/>
<g id=needle style="transition:transform 1s cubic-bezier(.2,.8,.2,1);transform-origin:120px 120px"><line x1=120 y1=120 x2=120 y2=62 stroke="#fff" stroke-width=3 stroke-linecap=round /><circle cx=120 cy=120 r=6 fill="#fff"/></g></svg>
<div class=pc><b id=pcr>–</b><span>PUT / CALL</span></div></div>
<div class=cv><span class=c id=cv>Calls –</span><span class=p id=pv>Puts –</span></div></section>
<section class="vd glass"><div class=lh><span>SHARE VOLUME · 5-MIN</span><span id=vdl></span></div><svg id=vds viewBox="0 0 340 140" role=img aria-label="Intraday volume chart"></svg><div class=lg><span><i style="background:#5ac8ff"></i>today</span><span><i style="background:#ffd25a"></i>typical (prior days avg)</span><span><i style="background:repeating-linear-gradient(90deg,#c9a0ff 0 3px,transparent 3px 5px)"></i>today median</span></div><div class=vr id=vdr></div></section>
<section class="ladder glass"><div class=lh><span class=p>PUTS</span><span>STRIKE HEAT</span><span class=c>CALLS</span></div><div id=lad></div></section>
<section class="tops glass"><div class=tabs2><button id=tc class="on c">Top calls</button><button id=tp class=p>Top puts</button></div><div id=top></div></section>
<div class=foot id=foot></div>
<script>
let sym='SPY',exp=null,D=null,side='calls',prevV={};
const $=s=>document.querySelector(s),f=n=>n==null?'–':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(n>=1e5?0:1)+'k':''+n;
const ct=t=>new Date(t*1000).toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',second:'2-digit'})+' ET';
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sym=b.dataset.s;exp=null;prevV={};document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x==b));load()});
$('#exp').onchange=e=>{exp=e.target.value;prevV={};render()};
$('#tc').onclick=()=>{side='calls';$('#tc').className='on c';$('#tp').className='p';render()};
$('#tp').onclick=()=>{side='puts';$('#tp').className='on p';$('#tc').className='c';render()};
const RAW='https://raw.githubusercontent.com/pgfgbmmd58-dev/Volume-tracker/',TOPIC='https://ntfy.sh/vt-b64757934d468d33/json?poll=1&since=latest';let SHA=null;
async function base(){try{const t=await (await fetch(TOPIC,{cache:'no-store'})).text();const m=JSON.parse(t.trim().split('\n').pop()).message;if(/^[0-9a-f]{40}$/.test(m))SHA=m}catch(e){}return SHA?RAW+SHA+'/':null}
async function getJ(b,f){if(b){try{const r=await fetch(b+f);if(r.ok)return await r.json()}catch(e){}}return (await fetch(f+'?'+Date.now())).json()}
async function load(){try{const b=await base();const[d,s]=await Promise.all([getJ(b,`data/${sym}.json`),getJ(b,'data/status.json')]);if(D&&D.fetched>d.fetched&&D.symbol===d.symbol)return;D=d;
const age=Date.now()/1000-d.fetched;$('#err').innerHTML=(!s.ok||age>600)?`<div class=warn>⚠ Stale / unavailable — last good data ${ct(d.fetched)}${s.error?' · '+s.error:''}</div>`:(age>180?`<div class=warn>⏱ Delayed ~${Math.round(age/60)} min — data ${ct(d.fetched)}</div>`:'');render(age<=600&&s.ok)}catch(e){$('#err').innerHTML='<div class=warn>⚠ Data unavailable</div>'}}
const unus=c=>{const r=c.openInterest?c.volume/c.openInterest:null,sp=c.prevVolume!=null&&c.volume-c.prevVolume>Math.max(500,.25*c.prevVolume);return{r,flag:(r>25&&c.volume>=1000)||sp,sp}};
function render(live=true){const E=Object.keys(D.expiries);if(!exp||!E.includes(exp))exp=E[0];
$('#exp').innerHTML=E.map((e,i)=>`<option value=${e} ${e==exp?'selected':''}>${new Date(e*1000).toLocaleDateString('en-US',{timeZone:'UTC',month:'short',day:'numeric'})}${i==0?' · 0DTE':''}</option>`).join('');
const x=D.expiries[exp],sum=a=>a.reduce((s,c)=>s+(c.volume||0),0),cv=sum(x.calls),pv=sum(x.puts),sp=D.spot,pc=cv?pv/cv:0;
$('#spot').textContent=sym+' '+sp.toFixed(2);$('#sub').innerHTML=(live?'<span class=live></span>':'')+'quote '+ct(D.quoteTime)+' · updated '+ct(D.fetched);
const share=pv/(cv+pv||1);$('#arc').style.strokeDashoffset=314.16*(1-share);$('#needle').style.transform=`rotate(${(share-.5)*180}deg)`;
$('#pcr').textContent=pc.toFixed(2);$('#pcr').style.color=pc>1.1?'#ff5277':pc<.9?'#3df5a0':'#ffd25a';
$('#cv').textContent='Calls '+f(cv);$('#pv').textContent='Puts '+f(pv)+'';
const C=Object.fromEntries(x.calls.map(c=>[c.strike,c])),P=Object.fromEntries(x.puts.map(c=>[c.strike,c]));
let ks=[...new Set([...x.calls,...x.puts].map(c=>c.strike))].filter(k=>k%1===0||sym!='SPY').sort((a,b)=>a-b);
const ai=ks.reduce((b,k,i)=>Math.abs(k-sp)<Math.abs(ks[b]-sp)?i:b,0);ks=ks.slice(Math.max(0,ai-9),ai+10).reverse();
const mx=Math.max(1,...ks.map(k=>Math.max(C[k]?.volume||0,P[k]?.volume||0))),atm=ks.reduce((a,k)=>Math.abs(k-sp)<Math.abs(a-sp)?k:a,ks[0]);
const bar=(c,s)=>{if(!c)return'';const v=c.volume||0,h=(v/mx).toFixed(2),u=unus(c),key=s+c.strike,pulse=(prevV[key]!=null&&v>prevV[key]*1.05)||u.sp;prevV[key]=v;
return`<div class="b ${u.flag?'flag':''} ${pulse?'pulse':''}" style="width:${Math.max(2,v/mx*78)}%;--h:${h}"><span class=v>${f(v)}</span></div>`};
$('#lad').innerHTML=ks.map(k=>`<div class="r ${k==atm?'atm':''}" style="opacity:${1-Math.min(.55,Math.abs(k-sp)/(sp*.012))}"><div class=L>${bar(P[k],'p')}</div><div class=k>${k}</div><div class=R>${bar(C[k],'c')}</div></div>`).join('');
const L=[...x[side]].sort((a,b)=>(b.volume||0)-(a.volume||0)).slice(0,8),cl=side=='calls'?'c':'p';
$('#top').innerHTML=`<div class="t th"><div>Strike</div><div>Vol</div><div>OI · V/OI</div><div>Last · IV</div></div>`+L.map(c=>{const u=unus(c);return`<div class=t><div class=${cl}><b>${c.strike}</b>${u.flag?' <span style="color:#ffd25a">●</span>':''}</div><div>${f(c.volume)}</div><div>${f(c.openInterest)} · <span style="color:${u.r>1?'#ffd25a':'inherit'}">${u.r==null?'–':u.r.toFixed(1)}</span></div><div>${c.lastPrice?.toFixed(2)} · ${c.impliedVolatility?(c.impliedVolatility*100).toFixed(0)+'%':'–'}</div></div>`}).join('');
try{vday()}catch(e){}
$('#foot').innerHTML='● unusual = Vol/OI &gt; 25× (0DTE always runs over 1×) or a volume jump since last refresh · glow = relative volume<br>Yahoo Finance data, may be delayed · OI is from prior day · data refreshes every 15s · times in ET';}

function vday(){const I=D.intraday,svg=$('#vds');if(!I||!I.bars||!I.bars.length){svg.innerHTML='<text x=170 y=72 fill="#7d8a99" font-size=12 text-anchor=middle>Intraday volume unavailable</text>';$('#vdr').textContent='';$('#vdl').textContent='';return}
const S=[];for(let m=570;m<960;m+=5)S.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));
const B=Object.fromEntries(I.bars),T=I.typical||{},ok=v=>v!=null&&v<=5e6;
const nowET=new Date().toLocaleString('en-CA',{timeZone:'America/New_York',hour12:false}).replace(',','');const td=nowET.slice(0,10),hm=nowET.slice(11,16);
const live=I.session===td&&hm>='09:30'&&hm<'16:00';
const vals=I.bars.map(b=>b[1]).filter(ok).sort((a,b)=>a-b),med=vals.length?vals[Math.floor(vals.length/2)]:0;
const mx=Math.max(1,...S.slice(1,-1).map(k=>Math.max(ok(B[k])?B[k]:0,T[k]||0)))*1.15,W=340,H=118,bw=W/S.length,y=v=>H-Math.min(v,mx)/mx*(H-6);
if(!svg.querySelector('#vbars')){let h='<g id=vbg></g><g id=vbars>';S.forEach((k,i)=>h+=`<rect class=vb data-k="${k}" x=${(i*bw+.4).toFixed(1)} y=6 width=${(bw-.8).toFixed(1)} height=${H-6} rx=1 fill="#5ac8ff" style="transform:scaleY(0)"/>`);svg.innerHTML=h+'</g><g id=vov></g>'}
const bin=hm.slice(0,3)+String(Math.floor(+hm.slice(3)/5)*5).padStart(2,'0'),fk=live&&B[bin]!=null?bin:null;
svg.querySelector('#vbg').innerHTML=`<rect x=0 y=0 width=${6*bw} height=${H} fill="rgba(90,200,255,.07)"/><rect x=${W-6*bw} y=0 width=${6*bw} height=${H} fill="rgba(255,82,119,.07)"/>`;
svg.querySelectorAll('.vb').forEach((el,i)=>{const k=el.dataset.k,v=B[k];if(v==null){el.style.transform='scaleY(0)';el.classList.remove('fm');return}
const c=v>5e6?'#56616e':k===fk?'#9ff0ff':(i<6||i>=S.length-6)?'#7fd6ff':'#5ac8ff';el.setAttribute('fill',c);el.setAttribute('opacity',k===fk?1:(T[k]&&v>1.5*T[k])?1:.75);el.classList.toggle('fm',k===fk);el.style.transform=`scaleY(${Math.max(.004,(H-y(v))/(H-6)).toFixed(4)})`});
let g='';const pts=S.map((k,i)=>T[k]!=null?`${(i*bw+bw/2).toFixed(1)},${y(T[k]).toFixed(1)}`:null).filter(Boolean).join(' ');
if(pts)g+=`<polyline points="${pts}" fill=none stroke="#ffd25a" stroke-width=1.3 opacity=.9 />`;
if(med)g+=`<line x1=0 x2=${W} y1=${y(med).toFixed(1)} y2=${y(med).toFixed(1)} stroke="#c9a0ff" stroke-width=1 stroke-dasharray="4 3"/><text x=${W-2} y=${(y(med)-3).toFixed(1)} fill="#c9a0ff" font-size=9 text-anchor=end>med ${f(med)}</text>`;
g+=`<line x1=0 x2=${W} y1=${H} y2=${H} stroke="rgba(255,255,255,.12)"/>`;
[['9:30',0],['open',3],['11',18],['12',30],['1',42],['2',54],['3',66],['close',75]].forEach(([t,i])=>g+=`<text x=${(i*bw+(t=='open'||t=='close'?bw/2:0)).toFixed(1)} y=${H+14} fill="${t=='open'?'#7fd6ff':t=='close'?'#ff8aa5':'#7d8a99'}" font-size=9 text-anchor=${t=='9:30'?'start':'middle'}>${t=='9:30'?'':t}</text>`);
if(B['09:30']>mx)g+=`<text x=${bw+2} y=10 fill="#7fd6ff" font-size=9>▲ 9:30 bar ${f(B['09:30'])}</text>`;
if(fk){const i=S.indexOf(fk),cx=i*bw+bw/2;g+=`<circle class=ld cx=${cx.toFixed(1)} cy=${Math.max(4,y(B[fk])-4).toFixed(1)} r=2.6 fill="#3df5a0" style="filter:drop-shadow(0 0 3px #3df5a0)"/>`}
svg.querySelector('#vov').innerHTML=g;
$('#vdl').innerHTML=live?'<span class=live></span>LIVE · ET':'last session '+new Date(I.session+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const done=I.bars.filter(b=>S.includes(b[0])&&ok(b[1])&&(!live||b[0]<bin));let cur=done[done.length-1];
const rx=(a,b)=>b?(a/b).toFixed(1)+'×':'–',sumR=ks=>{let a=0,b=0;ks.forEach(k=>{if(ok(B[k])&&T[k]){a+=B[k];b+=T[k]}});return b?a/b:null};
const o=sumR(S.slice(0,6)),c=sumR(S.slice(-6).filter(k=>B[k]!=null));
let r=[];if(fk){const sec=(+hm.slice(3)%5)*60+new Date().getSeconds(),pr=Math.round(B[fk]*300/Math.max(30,sec));r.push(sec<60||!B[fk]?`Forming ${fk} ET: ${f(B[fk])} so far (bar just opened)`:`Forming ${fk} ET: ${f(B[fk])} so far → projected ~${f(pr)}${T[fk]?' ('+rx(pr,T[fk])+' typical)':''}`)}if(cur&&T[cur[0]])r.push(`${live?'Last closed':'Last bar'} (${cur[0]} ET): ${f(cur[1])}, ${rx(cur[1],T[cur[0]])} typical for this time`);
if(o!=null)r.push(`opening 30m ${o.toFixed(1)}×`);if(c!=null&&S.slice(-6).every(k=>B[k]!=null))r.push(`closing 30m ${c.toFixed(1)}×`);
if(cur&&med)r.push(`${rx(cur[1],med)} today's median`);
$('#vdr').textContent=r.length?r.join(' · '):'Waiting for typical-day data';}
load();setInterval(load,8000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
